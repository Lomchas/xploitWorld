name: xploitworld-pvp
services:
  postgres:
    ports: !reset []
    networks: [arena_internal]
  init:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    environment: &arena_env
      GAME_MODE: pvp
      HOST: 0.0.0.0
      PORT: 3001
      NODE_ENV: ${PVP_NODE_ENV:-development}
      DATABASE_URL: postgresql://xwd_arena:${XWD_PVP_DB_PASSWORD:-xwd_arena}@postgres:5432/xwd_arena
      FRONTEND_ORIGINS: ${PVP_FRONTEND_ORIGINS:-http://pvp.localhost:5175,http://pvp.localhost:4175}
    networks: [arena_internal]
    depends_on:
      postgres: { condition: service_healthy }
    command: ["sh", "-c", "pnpm prisma:migrate:deploy && pnpm prisma:seed"]
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    environment: *arena_env
    depends_on:
      init: { condition: service_completed_successfully }
    networks: [arena_internal]
    expose: ["3001"]
  ingress:
    image: nginx:alpine
    volumes:
      - ./pvp-ingress.conf:/etc/nginx/conf.d/default.conf:ro
    ports: ["127.0.0.1:3001:3001"]
    depends_on: [api]
    networks: [arena_internal, edge]
networks:
  arena_internal:
    internal: true
  edge:
