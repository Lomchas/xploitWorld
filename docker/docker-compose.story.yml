name: xploitworld-story
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: xwd_story
      POSTGRES_PASSWORD: xwd_story
      POSTGRES_DB: xwd_story
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - story_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xwd_story -d xwd_story"]
      interval: 4s
      timeout: 5s
      retries: 12
volumes:
  story_data:
