name: xploitworld-pvp
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: xwd_arena
      POSTGRES_PASSWORD: ${XWD_PVP_DB_PASSWORD:-xwd_arena}
      POSTGRES_DB: xwd_arena
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - arena_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xwd_arena -d xwd_arena"]
      interval: 4s
      timeout: 5s
      retries: 12
volumes:
  arena_data:
