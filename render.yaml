services:
  - type: web
    name: xploitworld-pvp
    runtime: node
    plan: free
    region: oregon
    buildCommand: corepack pnpm install --frozen-lockfile --prod=false && corepack pnpm build:pvp
    startCommand: corepack pnpm start:pvp
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: xploitworld-pvp-db
          property: connectionString

databases:
  - name: xploitworld-pvp-db
    plan: free
    region: oregon
    postgresMajorVersion: "16"
    ipAllowList: []
